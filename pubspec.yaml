name: kickly
description: Kickly - organizza il calcetto, gioca e costruisci la tua storia.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.17.2
  go_router: ^18.0.1
  intl: ^0.20.3
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
